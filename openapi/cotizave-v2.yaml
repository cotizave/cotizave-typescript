openapi: 3.1.0
info:
  title: Cotizave API v2
  version: 2.0.0-alpha
  description: |
    v2 por dominios (fx, banks, holidays). Países publicados: VE, AR, CO,
    PE, MX, AU y ES,
    detrás de API_V2_ENABLED (apagado por defecto). Lo que no está acá no está
    implementado: ver docs/producto/v2-implementacion-2026-10-22.md.

    - Precios: número JSON. Un lado sin dato es `null`, nunca 0.
    - Errores: `{code, message, field?, details?}`, siempre JSON (también si se
      pidió CSV o XML). Mismos status y cabeceras de límite que v1.
    - Parámetros desconocidos: `400 unknown_parameter`.
    - Parámetros de consulta repetidos: `400 invalid_format` con el campo repetido.
    - Formatos: `?format=json|csv|xml` o `Accept` (CSV/XML desde Growth; 402 en Free y Basic).
    - Cuota y velocidad compartidas con v1 (mismo contador por cuenta).
servers:
  - url: https://api.cotizave.com
security:
  - ApiKey: []
tags:
  - name: fx
  - name: banks
  - name: holidays
  - name: countries
  - name: currencies
  - name: crypto
  - name: issuers
paths:
  /v2/fx/rates:
    get:
      tags: [fx]
      summary: La oficial de cada país publicado en una sola llamada.
      description: |
        `?symbols=BRL,EUR` filtra monedas (todos los planes). `?base=EUR` cambia
        la base (solo planes de pago; 402 en Free). `?format=map` devuelve el mapa
        compacto `{quote: mid}`; cualquier otro valor la lista rica (default).
      parameters:
        - {name: symbols, in: query, schema: {type: string}, description: 'Monedas ISO 4217 separadas por coma.'}
        - {name: base, in: query, schema: {type: string, pattern: '^[A-Za-z]{3}$'}, description: 'Moneda base (solo planes de pago). Default USD.'}
        - {name: format, in: query, schema: {type: string, enum: [list, map]}, description: 'Forma de la respuesta. Default list.'}
      responses:
        '200':
          description: Lista rica o mapa compacto, según format
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GlobalRatesList'
                  - $ref: '#/components/schemas/GlobalRatesMap'
        '400': {$ref: '#/components/responses/Error'}
        '402': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v2/fx/historical-limits:
    get:
      tags: [fx]
      summary: Cobertura del histórico (desde/hasta) de cada tasa que el plan ve.
      description: |
        Con API key cuenta cuota y trae la cobertura de cada tasa visible por el
        plan (no solo la oficial). Una cuenta sin tasas con histórico recibe 200
        con `limits` vacío. La variante pública solo oficiales vive en
        `/v2/public/historical-limits`.
      parameters: [{$ref: '#/components/parameters/format'}]
      responses:
        '200':
          description: Cobertura
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoricalLimitsResponse'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v2/issuers:
    get:
      tags: [issuers]
      summary: Directorio de instituciones que emiten las tasas oficiales. Todos los planes.
      description: |
        Datos fijos de referencia (procedencia): quién emite cada oficial de los
        países publicados, con qué tasas publica. Sin precios ni histórico.
      parameters: [{$ref: '#/components/parameters/format'}]
      responses:
        '200':
          description: Directorio
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuersResponse'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v2/public/issuers:
    get:
      tags: [issuers]
      summary: Directorio reducido de emisores, sin API key (cacheado en el edge).
      description: 'Sin key, sin cuota, solo JSON, cero parámetros. Subconjunto de /v2/issuers (id, nombres, tipo, países y nombre de cada tasa).'
      security: []
      responses:
        '200':
          description: Directorio reducido
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuersResponse'}
        '503': {$ref: '#/components/responses/Error'}
  /v2/public/historical-limits:
    get:
      tags: [fx]
      summary: Cobertura del histórico de las oficiales, sin API key (cacheado en el edge).
      description: 'Sin key, sin cuota, solo JSON, cero parámetros. Solo la oficial de cada país.'
      security: []
      responses:
        '200':
          description: Cobertura (solo oficiales)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoricalLimitsResponse'}
        '503': {$ref: '#/components/responses/Error'}
  /v2/fx/{cc}/rates:
    get:
      tags: [fx]
      summary: Todas las tasas del país
      description: |
        En Venezuela, las tasas restringidas por plan aparecen como descriptor
        sin precio. Free recibe los campos de V1 más `id`; Basic agrega
        `name`, `quote`, `stale`, `staleness_sec` y `available`; Growth y Pro
        agregan `description`, `tags`, `change_24h_pct`, `vs_official_pct` y
        `required_plan`. `stale_after_sec` conserva la omisión condicional de V1.
        En AR, CO, PE, MX,
        AU y ES todas las tasas publicadas incluyen precio en cualquier plan.
        SET-FX está deshabilitado en Colombia. En VE, `?markup=tag` conserva
        la variante V1 para planes con la capacidad de márgenes.
      parameters:
        - $ref: '#/components/parameters/cc'
        - {name: tag, in: query, schema: {type: string}, description: 'Id, id de v1 o alias (bcv, reference, euro…)'}
        - {name: category, in: query, schema: {$ref: '#/components/schemas/Category'}, description: 'Filtro histórico de v2; conserva los valores de categoría interna.'}
        - {name: base, in: query, schema: {type: string, pattern: '^[A-Za-z]{3}$'}}
        - {name: quote, in: query, schema: {type: string, pattern: '^[A-Za-z]{3}$'}}
        - {name: markup, in: query, schema: {type: string}, description: 'Regla de margen del usuario, solo VE y planes autorizados.'}
        - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: Colección
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string, example: 'private, max-age=30'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RatesResponse'}
              examples:
                free:
                  value:
                    country: VE
                    currency: VES
                    base: USD
                    fetched_at: '2026-10-22T13:05:03Z'
                    plan: free
                    index: {value: 290.85, version: v1}
                    rates:
                      - {id: ve-bcv, market: reference, type: reference, base: USD, mid: 248.45123456, updated_at: '2026-10-22T04:00:00Z', effective_date: '2026-10-22'}
                      - {id: ve-binance, market: binance, type: p2p, base: USD, mid: 290.85, bid: 290.4, ask: 291.3, updated_at: '2026-10-22T12:58:40Z'}
                      - {id: ve-cash}
        '304': {description: Not Modified (If-None-Match)}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '402': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Error'}
  /v2/fx/{cc}/rates/{id}:
    get:
      tags: [fx]
      summary: Una tasa por id canónico
      parameters:
        - $ref: '#/components/parameters/cc'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: Tasa con campos según plan; Free conserva el contrato V1 más id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rate'}
        '304': {description: Not Modified}
        '400': {$ref: '#/components/responses/Error'}
        '402': {description: 'feature_not_in_plan (details: feature, id, required_plan)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: 'resource_not_found en VE sin dato, o rate_not_found / country_not_supported', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {description: 'Tasa registrada sin dato en este momento', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v2/fx/{cc}/rates/{id}/history:
    get:
      tags: [fx]
      summary: Histórico de una tasa
      description: |
        `?date=` → un punto (la tasa que regía ese día). Sin `date`:
        `granularity=daily` (default, sin paginación) o `raw` (paginada con
        `cursor`/`limit`; las páginas avanzan hacia atrás en el tiempo y cada
        una viene en orden ascendente). Retención según el plan.
      parameters:
        - $ref: '#/components/parameters/cc'
        - $ref: '#/components/parameters/id'
        - {name: date, in: query, schema: {type: string, format: date}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: granularity, in: query, schema: {type: string, enum: [daily, raw], default: daily}}
        - {name: cursor, in: query, schema: {type: string}, description: 'Solo raw. Opaco.'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 5000, default: 1000}, description: 'Solo raw.'}
        - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: Punto o colección
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HistoryPointResponse'
                  - $ref: '#/components/schemas/HistoryCollection'
        '400': {$ref: '#/components/responses/Error'}
        '402': {$ref: '#/components/responses/Error'}
        '403': {description: history_out_of_retention, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: 'rate_not_found | history_not_available | sin registro', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {$ref: '#/components/responses/Error'}
  /v2/fx/{cc}/markets:
    get:
      tags: [fx]
      summary: Catálogo de tasas del país (sin precios). Desde Growth.
      parameters:
        - $ref: '#/components/parameters/cc'
        - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema:
                type: object
                required: [country, markets]
                properties:
                  country: {type: string}
                  markets:
                    type: array
                    items: {$ref: '#/components/schemas/MarketEntry'}
        '402': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /v2/fx/{cc}/spread:
    get:
      tags: [fx]
      summary: Diferencial de la oficial contra otra tasa del país. Desde Growth.
      parameters:
        - $ref: '#/components/parameters/cc'
        - {name: against, in: query, schema: {type: string, default: ve-paralelo}}
        - {name: base, in: query, schema: {type: string, enum: [USD], default: USD}}
        - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: Spread
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpreadResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '402': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /v2/fx/{cc}/route:
    get:
      tags: [fx]
      summary: Mejor tasa ejecutable del país. Desde Pro.
      parameters:
        - $ref: '#/components/parameters/cc'
        - {name: from, in: query, required: true, schema: {type: string}}
        - {name: to, in: query, required: true, schema: {type: string}}
        - {name: amount, in: query, required: true, schema: {type: number}}
        - {name: direction, in: query, schema: {type: string, enum: [send, receive], default: send}}
        - {name: max_staleness, in: query, schema: {type: integer}}
        - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: Ruta
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RouteResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '402': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v2/fx/{cc}/bank-rates:
    get:
      tags: [fx]
      summary: Cotizaciones del BCV por banco (todos los planes)
      description: |
        Lo que el BCV publica en "tasas informativas del sistema bancario".
        Cada fila la identifica el banco (código SUDEBAN o null), no un id de
        tasa. En VE, sin filtro `bank`, `bank_rates` y `captured_at` conservan la respuesta V1:
        allí `stale` significa publicación anterior. En `banks`, `stale`
        significa que la cotización superó su umbral de antigüedad.
      parameters:
        - $ref: '#/components/parameters/cc'
        - {name: bank, in: query, schema: {type: string, pattern: '^[0-9]{4}$'}, description: Filtra por código SUDEBAN}
        - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: Tasas por banco
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GeoFields'
                  - type: object
                    required: [indicator_date, fetched_at, plan, banks]
                    properties:
                      indicator_date: {type: string, format: date}
                      fetched_at: {type: string, format: date-time}
                      captured_at: {type: string, format: date-time, description: 'Alias V1; solo VE.'}
                      plan: {type: string}
                      banks: {type: array, items: {$ref: '#/components/schemas/BankRate'}}
                      bank_rates: {type: array, description: 'Filas V1 con bank, buy, sell, date, stale y days_behind; solo VE y sin filtro bank.', items: {type: object}}
        '400': {description: '`bank` no válido, o filtro por banco no disponible en el país (AU)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: 'bcv_snapshot_unavailable en VE; bank_rates_not_available si el país no publica tasas por banco', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: 'bank_rates_unavailable para fuentes bancarias fuera de VE', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v2/fx/convert:
    get:
      tags: [fx]
      summary: Una conversión
      description: |
        VE: USD/EUR ↔ VES, default `via` = la oficial de esa moneda (ve-bcv / ve-euro).
        CO: USD ↔ COP, default `via` = co-trm; `date` solo con co-trm (TRM que regía ese día).
        AU: USD ↔ AUD, default `via` = au-official; sin `date`.
        JP: USD ↔ JPY, default `via` = jp-official; `date` con jp-official.
        LATAM (pe, py, bo, ar, br, cl, uy, mx, cr, gt, hn, do): USD ↔ local,
        default `via` = {cc}-official; `date` en pe, ar, br, cl y hn.
        SE/PL/CH: USD ↔ local y EUR ↔ local; default `via` = la oficial en
        esa moneda ({cc}-official / {cc}-official-eur); `date` con la oficial en USD.
        Con `via` explícito, una tasa EUR registrada puede convertir EUR ↔ moneda
        local aunque ese país no tenga una referencia EUR predeterminada (por ejemplo,
        remesas desde España en AR/CO/MX). Las remesas solo admiten EUR → local.
        `via` debe coincidir con el par; no se sustituyen tasas ni se cruzan pares.
        Las tasas extras del BCV CNY/TRY/RUB se publican en `/rates`, pero no son
        convertibles y un `via` que las seleccione devuelve 400 con campo `via`.
        `date` desde Growth y solo donde exista histórico de conversión apto.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string}}
        - {name: to, in: query, required: true, schema: {type: string}}
        - {name: amount, in: query, required: true, schema: {type: number, exclusiveMinimum: 0, maximum: 1000000000000}}
        - {name: via, in: query, schema: {type: string}, description: 'Id de v2 (ve-binance…). Solo tasas del snapshot.'}
        - {name: market, in: query, schema: {type: string}, description: 'Alias V1 local de via, para VE.'}
        - {name: date, in: query, schema: {type: string, format: date}}
        - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: Conversión
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConvertResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '402': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    post:
      tags: [fx]
      summary: Hasta 50 conversiones. Desde Pro. Cuenta 1 consulta.
      description: 'Acepta exactamente un objeto JSON: el body V2 con conversions o el body V1 con from, to, amounts y market. Un segundo documento JSON devuelve 400 invalid_format. La segunda variante responde con rate, market, type, updated_at, results, total_in, total_out e id.'
      parameters:
        - $ref: '#/components/parameters/format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [conversions]
                  properties:
                    conversions:
                      type: array
                      minItems: 1
                      maxItems: 50
                      items:
                        type: object
                        additionalProperties: false
                        required: [from, to, amount]
                        properties:
                          from: {type: string}
                          to: {type: string}
                          amount: {type: number}
                          via: {type: string}
                          date: {type: string, format: date}
                - type: object
                  required: [from, to, amounts]
                  properties:
                    from: {type: string}
                    to: {type: string}
                    amounts: {type: array, minItems: 1, maxItems: 50, items: {type: number}}
                    market: {type: string}
      responses:
        '200':
          description: Un resultado por ítem, en el mismo orden (conversión o error)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BulkConvertResponse'
                  - type: object
                    required: [id, rate, market, type, updated_at, results, total_in, total_out]
                    properties:
                      id: {type: string}
                      rate: {type: number}
                      market: {type: string}
                      type: {$ref: '#/components/schemas/RateType'}
                      updated_at: {type: string, format: date-time}
                      results: {type: array, items: {type: object, required: [amount, result], properties: {amount: {type: number}, result: {type: number}}}}
                      total_in: {type: number}
                      total_out: {type: number}
        '400': {$ref: '#/components/responses/Error'}
        '402': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v2/crypto:
    get:
      tags: [crypto]
      summary: Estables USDT, USDC y EURC en dólares. Desde Growth.
      description: |
        Precio en dólares de las monedas estables publicadas por Cotizave,
        con la misma forma de fila que `/v2/fx/{cc}/rates` (`type: crypto`,
        `quote: USD`, `mid` = punto medio entre compra y venta). Se renueva cada
        5 minutos. Los planes sin la función reciben el descriptor sin precio
        (`available: false`, `required_plan`).
      parameters:
        - {name: tag, in: query, schema: {type: string}, description: 'Id o etiqueta (usdt, stablecoin…)'}
        - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: Colección
          content:
            application/json:
              schema:
                type: object
                required: [base, fetched_at, plan, rates]
                properties:
                  base: {type: string, example: USD}
                  fetched_at: {type: string, format: date-time}
                  plan: {type: string}
                  rates: {type: array, items: {$ref: '#/components/schemas/Rate'}}
              examples:
                growth:
                  value:
                    base: USD
                    fetched_at: '2026-10-22T13:05:00Z'
                    plan: indie
                    rates:
                      - {id: usdt-usd, market: crypto_usdt, name: Tether, type: crypto, base: USDT, quote: USD, mid: 0.998695, bid: 0.99869, ask: 0.9987, updated_at: '2026-10-22T13:05:00Z', stale: false, stale_after_sec: 900, staleness_sec: 12, change_24h_pct: -0.04, tags: [crypto, usdt, stablecoin], available: true, required_plan: indie}
                      - {id: eurc-usd, market: crypto_eurc, name: Euro Coin, type: crypto, base: EURC, quote: USD, mid: 1.12, bid: 1.1199, ask: 1.1201, updated_at: '2026-10-22T13:05:00Z', stale: false, stale_after_sec: 900, staleness_sec: 12, change_24h_pct: 0.01, tags: [crypto, eurc, stablecoin], available: true, required_plan: indie}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Error'}
  /v2/crypto/{id}:
    get:
      tags: [crypto]
      summary: Una moneda estable (usdt-usd, usdc-usd, eurc-usd). Desde Growth.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, enum: [usdt-usd, usdc-usd, eurc-usd]}}
        - $ref: '#/components/parameters/format'
      responses:
        '200': {description: Tasa (incluye `fetched_at`), content: {application/json: {schema: {$ref: '#/components/schemas/Rate'}}}}
        '402': {description: 'feature_not_in_plan (details: feature, id, required_plan)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: rate_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Sin dato en este momento, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v2/countries:
    get:
      tags: [countries]
      summary: Países publicados. Desde Pro.
      parameters: [{$ref: '#/components/parameters/format'}]
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                type: object
                required: [countries]
                properties:
                  countries: {type: array, items: {$ref: '#/components/schemas/Country'}}
        '402': {$ref: '#/components/responses/Error'}
  /v2/countries/{cc}:
    get:
      tags: [countries]
      summary: Un país publicado. Desde Pro.
      parameters:
        - {name: cc, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z]{2}$'}}
        - $ref: '#/components/parameters/format'
      responses:
        '200': {description: País, content: {application/json: {schema: {$ref: '#/components/schemas/Country'}}}}
        '402': {$ref: '#/components/responses/Error'}
        '404': {description: country_not_supported, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v2/currencies:
    get:
      tags: [currencies]
      summary: Monedas que Cotizave cotiza (ISO 4217). Desde Pro.
      parameters: [{$ref: '#/components/parameters/format'}]
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                type: object
                required: [currencies]
                properties:
                  currencies: {type: array, items: {$ref: '#/components/schemas/Currency'}}
        '402': {$ref: '#/components/responses/Error'}
  /v2/currencies/{code}:
    get:
      tags: [currencies]
      summary: Una moneda. Desde Pro.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z]{3}$'}}
        - $ref: '#/components/parameters/format'
      responses:
        '200': {description: Moneda, content: {application/json: {schema: {$ref: '#/components/schemas/Currency'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '402': {$ref: '#/components/responses/Error'}
        '404': {description: currency_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v2/banks/{cc}:
    get:
      tags: [banks]
      summary: Bancos del país (identidad, sin precio)
      parameters:
        - $ref: '#/components/parameters/cc'
        - {name: q, in: query, schema: {type: string}}
        - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                type: object
                required: [country, total, banks]
                properties:
                  country: {type: string}
                  total: {type: integer}
                  banks: {type: array, items: {$ref: '#/components/schemas/Bank'}}
        '404': {$ref: '#/components/responses/Error'}
  /v2/banks/{cc}/{code}:
    get:
      tags: [banks]
      summary: Un banco por su código oficial (SUDEBAN en VE)
      parameters:
        - $ref: '#/components/parameters/cc'
        - {name: code, in: path, required: true, schema: {type: string, pattern: '^[0-9]{4}$'}}
        - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: Banco
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bank'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {description: bank_not_found | country_not_supported, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v2/holidays/{cc}:
    get:
      tags: [holidays]
      summary: Feriados (año), ¿es feriado? (date) o el próximo (from). Desde Basic en V2.
      description: '`year`, `date` y `from` son excluyentes (400 si vienen dos).'
      parameters:
        - $ref: '#/components/parameters/cc'
        - {name: year, in: query, schema: {type: integer, minimum: 1583, maximum: 9999}}
        - {name: date, in: query, schema: {type: string, format: date}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: Según el modo
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [country, year, holidays]
                    properties:
                      country: {type: string}
                      year: {type: integer}
                      holidays: {type: array, items: {$ref: '#/components/schemas/Holiday'}}
                  - type: object
                    required: [country, date, is_holiday, holiday]
                    properties:
                      country: {type: string}
                      date: {type: string, format: date}
                      is_holiday: {type: boolean}
                      holiday: {oneOf: [{$ref: '#/components/schemas/Holiday'}, {type: 'null'}]}
                  - type: object
                    required: [country, from, days_until, holiday]
                    properties:
                      country: {type: string}
                      from: {type: string, format: date}
                      days_until: {type: integer}
                      holiday: {$ref: '#/components/schemas/Holiday'}
        '400': {$ref: '#/components/responses/Error'}
        '402': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {description: 'holidays_not_available (año fuera de la tabla, details first_year/last_year)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {$ref: '#/components/responses/Error'}
  /v2/holidays/{cc}/business-days:
    get:
      tags: [holidays]
      summary: Fecha resultante de sumar N días hábiles. Desde Basic en V2.
      parameters:
        - $ref: '#/components/parameters/cc'
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: days, in: query, required: true, schema: {type: integer, minimum: 0, maximum: 3650}}
        - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                required: [country, from, days, result]
                properties:
                  country: {type: string}
                  from: {type: string, format: date}
                  days: {type: integer}
                  result: {type: string, format: date}
        '400': {$ref: '#/components/responses/Error'}
        '402': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    ApiKey: {type: apiKey, in: header, name: X-API-Key}
  parameters:
    cc: {name: cc, in: path, required: true, schema: {type: string, enum: [ve, co, au, jp, se, pl, ch, pe, py, bo, ar, br, cl, uy, mx, cr, gt, hn, do, in, id, ph, th, za, cn, il, hk, ke, gh, ng, tr, ro, hu, it, nl, be, at, ie, fi, gr, hr, si, sk, ee, lv, lt, lu, mt, cy, bg, es, fr, de, pt, is, ua, ge, mk, md, am, uz, az, kz, kg]}, description: 'ISO 3166 alfa-2, minúscula (case-insensitive). Todos van con API_V2_ENABLED.'}
    id: {name: id, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z]{2}-[A-Za-z0-9-]+$'}, description: 'Id canónico (ve-bcv). Case-insensitive.'}
    format: {name: format, in: query, schema: {type: string, enum: [json, csv, xml]}}
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Límite de velocidad o cuota (mismas cabeceras que v1)
      headers:
        Retry-After: {schema: {type: integer}}
        X-RateLimit-Scope: {schema: {type: string, enum: [burst, monthly]}}
        X-RateLimit-Limit-Minute: {schema: {type: integer}, description: Consultas por minuto del plan}
        X-RateLimit-Remaining-Minute: {schema: {type: integer}}
        X-RateLimit-Retry-After-Ms: {schema: {type: integer}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string, examples: [rate_not_found, country_not_supported, feature_not_in_plan, unknown_parameter]}
        message: {type: string}
        field: {type: string}
        details: {type: object}
    Category:
      type: string
      description: 'Valores del parámetro de filtro category; su nombre y valores se mantienen.'
      enum: [official, interbank, parallel, securities, crypto_p2p, crypto_exchange, bank_board, cash, remittance, card, exchange_house, crypto]
    RateType:
      type: string
      description: 'Valores compatibles con v1 para VE; las clases exclusivas de v2 conservan su significado propio.'
      enum: [reference, interbank, parallel, securities, p2p, crypto_exchange, bank_board, cash, remittance, card, exchange_house, crypto]
    Rate:
      type: object
      description: 'Campos presentes según plan. En VE los campos V1 conservan exactamente sus reglas de omisión; Free añade solo id.'
      required: [id, market, type, mid, updated_at]
      properties:
        id: {type: string}
        market: {type: string, description: 'Identificador local estable; en VE es exactamente el market de v1. Para monedas BCV adicionales es el código ISO 4217.'}
        name: {type: string, description: 'Basic+'}
        description: {type: string, description: 'Qué es la tasa, quién la publica, cada cuánto cambia y para qué se usa. Según Accept-Language (es/en; sin encabezado, en). Ausente si no hay texto.'}
        type: {$ref: '#/components/schemas/RateType'}
        base: {type: string, description: 'En VE se omite si V1 lo omitía.'}
        quote: {type: string, description: 'Basic+'}
        mid: {type: number}
        bid: {type: [number, 'null'], description: 'VE conserva la omisión V1 si no existe precio de compra.'}
        ask: {type: [number, 'null'], description: 'VE conserva la omisión V1 si no existe precio de venta.'}
        updated_at: {type: string, format: date-time, description: Momento del dato en la fuente}
        effective_date: {type: string, format: date, description: Fecha valor (solo oficiales)}
        fetched_at: {type: string, format: date-time, description: Solo en el recurso individual}
        stale: {type: boolean, description: 'Basic+ en /rates; Free lo conserva en /convert.'}
        stale_after_sec: {type: integer, description: 'En VE aparece cuando V1 tenía un umbral explícito.'}
        staleness_sec: {type: integer, description: 'Basic+ en /rates; Free lo conserva en /convert y /route.'}
        change_24h_pct: {type: [number, 'null'], description: 'Growth+. Contra la última captura de hace ≥24 h'}
        vs_official_pct: {type: [number, 'null'], description: 'Growth+. Contra la oficial de la misma base; null en oficiales'}
        tags: {type: array, items: {type: string}, description: 'Growth+'}
        available: {const: true, description: 'Basic+'}
        required_plan: {type: string, enum: [free, hobby, indie, pro, pro_extra], description: 'Growth+. Id del plan público mínimo que habilita la tasa; hobby = Basic, indie = Growth.'}
    RateDescriptor:
      type: object
      description: 'Tasa VE restringida: Free ve solo id, Basic ve identidad y available=false, Growth+ ve el descriptor completo.'
      required: [id]
      properties:
        id: {type: string}
        market: {type: string, description: Identificador local estable}
        name: {type: string}
        description: {type: string, description: 'Qué es la tasa, quién la publica, cada cuánto cambia y para qué se usa. Según Accept-Language (es/en; sin encabezado, en). Ausente si no hay texto.'}
        type: {$ref: '#/components/schemas/RateType'}
        base: {type: string}
        quote: {type: string}
        tags: {type: array, items: {type: string}}
        available: {const: false}
        required_plan: {type: string, enum: [free, hobby, indie, pro, pro_extra], description: 'Id del plan público mínimo que habilita la tasa; hobby = Basic, indie = Growth.'}
    GeoFields:
      type: object
      description: 'Datos del país en el primer nivel. country y currency en todos los planes; la geografía solo en Pro+.'
      required: [country, currency]
      properties:
        country: {type: string}
        country_name: {type: string, description: Pro+}
        flag: {type: string, description: Pro+}
        continent: {type: string, description: Pro+}
        region: {type: string, description: 'Pro+ (UN M49)'}
        region_code: {type: string, description: 'Pro+ (UN M49)'}
        timezone: {type: string, description: 'Pro+ (IANA)'}
        currency: {type: string}
    RatesResponse:
      allOf:
        - $ref: '#/components/schemas/GeoFields'
        - type: object
          required: [base, fetched_at, plan, rates]
          properties:
            base: {type: string}
            fetched_at: {type: string, format: date-time}
            plan: {type: string}
            index: {type: object, description: 'Cotizave Index (mismo objeto que /v1/fx/rates). Solo VE.'}
            rates:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/Rate'
                  - $ref: '#/components/schemas/RateDescriptor'
    BankRate:
      type: object
      required: [bank, base, quote, mid, bid, ask, updated_at, stale, stale_after_sec, staleness_sec, days_behind]
      properties:
        bank:
          type: object
          required: [code, name]
          properties:
            code: {type: [string, 'null'], description: 'SUDEBAN; null si no hay código confiable'}
            name: {type: string, description: Nombre tal como lo publica el BCV}
        base: {type: string}
        quote: {type: string}
        mid: {type: number}
        bid: {type: [number, 'null']}
        ask: {type: [number, 'null']}
        updated_at: {type: string, format: date-time}
        effective_date: {type: string, format: date, description: 'Fecha valor (VE); ausente si el banco no la publica (AU)'}
        stale: {type: boolean}
        stale_after_sec: {type: integer}
        staleness_sec: {type: integer}
        days_behind: {type: integer, description: Días detrás de la última publicación}
        vs_official_pct: {type: [number, 'null'], description: Growth+}
    Country:
      type: object
      required: [code, name, flag, continent, region, region_code, currency, timezone, rates]
      properties:
        code: {type: string}
        name: {type: string, description: Según Accept-Language (es/en)}
        flag: {type: string}
        continent: {type: string}
        region: {type: string}
        region_code: {type: string}
        currency: {type: string}
        timezone: {type: string}
        rates: {type: array, items: {type: string}}
    Currency:
      type: object
      required: [code, numeric_code, name, minor_unit, symbol]
      properties:
        code: {type: string}
        numeric_code: {type: string}
        name: {type: string, description: Según Accept-Language (es/en)}
        minor_unit: {type: integer}
        symbol: {type: string}
    MarketEntry:
      type: object
      required: [id, market, name, type, base, quote, tags, stale_after_sec, available, required_plan, conversion_directions]
      properties:
        id: {type: string}
        market: {type: string}
        aliases: {type: array, items: {type: string}, description: 'Aliases V1 para mercados VE.'}
        name: {type: string}
        type: {$ref: '#/components/schemas/RateType'}
        base: {type: string}
        quote: {type: string}
        tags: {type: array, items: {type: string}}
        stale_after_sec: {type: integer}
        available: {type: boolean}
        required_plan: {type: string, enum: [free, hobby, indie, pro, pro_extra], description: 'Id del plan público mínimo que habilita la tasa; hobby = Basic, indie = Growth.'}
        conversion_directions:
          type: array
          description: 'Pares que /convert admite para esta tasa, independientemente del plan y de si hay precio utilizable ahora. Vacío para tasas fuera del snapshot de conversión.'
          items:
            type: object
            required: [from, to]
            properties:
              from: {type: string}
              to: {type: string}
    HistoryPointResponse:
      type: object
      required: [id, market, base, quote, date, mid, updated_at, fetched_at]
      properties:
        id: {type: string}
        market: {type: string}
        base: {type: string}
        quote: {type: string}
        date: {type: string, format: date}
        mid: {type: number}
        updated_at: {type: string, format: date-time}
        fetched_at: {type: string, format: date-time, description: 'En histórico diario propio, última escritura de esa versión; en VE, captura guardada; en el respaldo TRM, hora de armado de la respuesta.'}
    HistoryCollection:
      type: object
      required: [id, market, base, quote, from, to, granularity, count, next_cursor, points]
      properties:
        id: {type: string}
        market: {type: string}
        base: {type: string}
        quote: {type: string}
        from: {type: string, format: date}
        to: {type: string, format: date}
        granularity: {type: string, enum: [daily, raw]}
        count: {type: integer}
        next_cursor: {type: [string, 'null']}
        points:
          type: array
          items:
            type: object
            required: [date, mid, updated_at, fetched_at]
            properties:
              date: {type: string, format: date}
              mid: {type: number}
              updated_at: {type: string, format: date-time}
              fetched_at: {type: string, format: date-time, description: 'En histórico diario propio, última escritura de esa versión; en VE, captura guardada; en el respaldo TRM, hora de armado de la respuesta.'}
    ConvertResponse:
      type: object
      required: [from, to, rate, via, market, type, updated_at, staleness_sec, stale]
      properties:
        from: {$ref: '#/components/schemas/Amount'}
        to: {$ref: '#/components/schemas/Amount'}
        rate: {type: number}
        via: {type: string}
        market: {type: string, description: 'Identificador local de la tasa usada; via conserva el id global de v2.'}
        type: {$ref: '#/components/schemas/RateType'}
        updated_at: {type: string, format: date-time}
        effective_date: {type: string, format: date}
        date: {type: string, format: date}
        staleness_sec: {type: integer}
        stale: {type: boolean}
    Amount:
      type: object
      required: [currency, amount]
      properties:
        currency: {type: string}
        amount: {type: number}
    SpreadResponse:
      type: object
      required: [country, reference, compared, spread, fetched_at]
      properties:
        country: {type: string}
        reference: {$ref: '#/components/schemas/SpreadQuote'}
        compared: {$ref: '#/components/schemas/SpreadQuote'}
        spread:
          type: object
          required: [absolute, percentage, direction]
          properties:
            absolute: {type: number}
            percentage: {type: number}
            direction: {type: string}
        fetched_at: {type: string}
    SpreadQuote:
      type: object
      required: [id, market, value, updated_at]
      properties:
        id: {type: string}
        market: {type: string}
        value: {type: number}
        updated_at: {type: string}
    RouteResponse:
      type: object
      required: [country, from, direction, best, alternatives, fetched_at]
      properties:
        country: {type: string}
        from: {$ref: '#/components/schemas/Amount'}
        direction: {type: string}
        best: {$ref: '#/components/schemas/RouteOption'}
        alternatives: {type: array, items: {$ref: '#/components/schemas/RouteOption'}}
        skipped:
          type: array
          items:
            type: object
            required: [id, market, reason]
            properties:
              id: {type: string}
              market: {type: string}
              reason: {type: string}
        fetched_at: {type: string}
    RouteOption:
      type: object
      required: [id, market, type, rate, amount, updated_at, staleness_sec]
      properties:
        id: {type: string}
        market: {type: string}
        type: {$ref: '#/components/schemas/RateType'}
        rate: {type: number}
        amount: {type: number}
        updated_at: {type: string}
        staleness_sec: {type: integer}
    Bank:
      type: object
      required: [country, code, name, type, bank_rates]
      properties:
        country: {type: string}
        code: {type: string}
        name: {type: string}
        type: {type: [string, 'null'], enum: [public, private, null], description: 'null si la fuente no lo informa (CO)'}
        bank_rates: {type: [string, 'null'], description: 'Enlace a sus cotizaciones en /v2/fx/{cc}/bank-rates?bank=; null si no hay'}
    Holiday:
      type: object
      required: [date, local_name, name, type, fixed, global]
      properties:
        date: {type: string, format: date}
        local_name: {type: string}
        name: {type: string}
        type: {type: string}
        types: {type: array, items: {type: string}}
        fixed: {type: boolean}
        global: {type: boolean}
    GlobalRateRow:
      type: object
      required: [id, country, quote, mid, updated_at, stale, stale_after_sec]
      properties:
        id: {type: string}
        country: {type: string}
        quote: {type: string}
        mid: {type: number}
        updated_at: {type: string, format: date-time}
        stale: {type: boolean}
        stale_after_sec: {type: integer}
    GlobalRatesList:
      type: object
      required: [base, date, count, rates]
      properties:
        base: {type: string}
        date: {type: string, format: date-time}
        count: {type: integer}
        rates: {type: array, items: {$ref: '#/components/schemas/GlobalRateRow'}}
    GlobalRatesMap:
      type: object
      required: [base, date, rates]
      properties:
        base: {type: string}
        date: {type: string, format: date-time}
        rates:
          type: object
          additionalProperties: {type: number}
          description: 'Mapa de moneda de cotización a mid (unidades por 1 base).'
    HistoricalLimitRow:
      type: object
      required: [id, country, quote, first, last, days]
      properties:
        id: {type: string}
        country: {type: string}
        quote: {type: string}
        base: {type: string, description: 'Omitido = USD; EUR en oficiales en euro.'}
        first: {type: string, format: date}
        last: {type: string, format: date}
        days: {type: integer}
    HistoricalLimitsResponse:
      type: object
      required: [base, count, limits]
      properties:
        base: {type: string, example: USD}
        count: {type: integer}
        limits: {type: array, items: {$ref: '#/components/schemas/HistoricalLimitRow'}}
    IssuerPublishes:
      type: object
      required: [rate_id, label]
      properties:
        rate_id: {type: string}
        label: {type: string}
        pair: {type: string}
        schedule: {type: string}
        value_date: {type: string}
        source: {type: string}
        status: {type: string}
    IssuerJurisdiction:
      type: object
      required: [countries]
      properties:
        countries: {type: array, items: {type: string}}
        currency: {type: string}
    IssuerLinks:
      type: object
      required: [website]
      properties:
        website: {type: string}
    Issuer:
      type: object
      required: [id, name, short_name, kind, jurisdiction, publishes]
      properties:
        id: {type: string}
        name: {type: string}
        short_name: {type: string}
        kind: {type: string, description: 'central_bank, exchange, aggregator, …'}
        jurisdiction: {$ref: '#/components/schemas/IssuerJurisdiction'}
        timezone: {type: string}
        links: {$ref: '#/components/schemas/IssuerLinks'}
        publishes: {type: array, items: {$ref: '#/components/schemas/IssuerPublishes'}}
    IssuerWithout:
      type: object
      required: [rate_id, country, reason, status]
      properties:
        rate_id: {type: string}
        country: {type: string}
        reason: {type: string}
        status: {type: string}
    IssuersSummary:
      type: object
      required: [issuers, countries]
      properties:
        issuers: {type: integer}
        countries: {type: integer}
    IssuersResponse:
      type: object
      required: [issuers]
      properties:
        issuers: {type: array, items: {$ref: '#/components/schemas/Issuer'}}
        without_issuer: {type: array, items: {$ref: '#/components/schemas/IssuerWithout'}}
        summary: {$ref: '#/components/schemas/IssuersSummary'}
    BulkConvertItem:
      type: object
      required: [index]
      description: 'One result per input item, in request order: a conversion or an error.'
      properties:
        index: {type: integer, description: 'Position in the request array.'}
        conversion: {$ref: '#/components/schemas/ConvertResponse'}
        error: {$ref: '#/components/schemas/Error'}
    BulkConvertResponse:
      type: object
      required: [count, succeeded, failed, results]
      properties:
        count: {type: integer}
        succeeded: {type: integer}
        failed: {type: integer}
        results: {type: array, items: {$ref: '#/components/schemas/BulkConvertItem'}}
