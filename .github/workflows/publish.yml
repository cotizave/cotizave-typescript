name: Publish

# Publishes to npm only for an approved, tagged release — never on a push or a PR.
# Requires npm Trusted Publishing (OIDC) to be configured for @cotizave/sdk, and
# a GitHub Environment named "npm-publish" with required reviewers so a human must
# approve each run.
on:
  release:
    types: [published]
  workflow_dispatch:

# OIDC token for Trusted Publishing; read-only on repo contents. No long-lived
# npm token is stored.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # npm 11.5.1+ is required for Trusted Publishing (OIDC) with provenance.
      - name: Ensure a recent npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify types match the spec
        run: |
          npm run generate:types
          git diff --exit-code -- src/types/generated.ts

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify packaged contents
        run: npm pack --dry-run

      # With Trusted Publishing configured, no NODE_AUTH_TOKEN is needed; npm
      # exchanges the OIDC token automatically and attaches provenance.
      - name: Publish to npm
        run: npm publish --provenance --access public
