name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate types and verify they match the OpenAPI spec
        run: |
          npm run generate:types
          git diff --exit-code -- src/types/generated.ts \
            || (echo "::error::Generated types are out of date. Run 'npm run generate:types' and commit." && exit 1)

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Type inference tests
        run: npm run test:types

      - name: Unit & contract tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify packaged contents
        run: npm pack --dry-run

      - name: Validate package exports and types (publint + are-the-types-wrong)
        run: npm run check:package
